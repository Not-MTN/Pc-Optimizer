name: debug
on: [push, workflow_dispatch]
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install --quiet pytest
      - name: doctor json probe
        working-directory: engine
        continue-on-error: true
        run: |
          python -c "
          import sys,json,subprocess
          r=subprocess.run([sys.executable,'-m','pco_engine.cli','--backend','windows','doctor','--json'],capture_output=True,text=True,encoding='utf-8')
          print('::error::RC=' + str(r.returncode))
          print('::error::STDOUT=' + (r.stdout or '')[:600].replace('%','%%'))
          print('::error::STDERR=' + (r.stderr or '')[-1200:].replace('%','%%').replace(chr(10),' | '))
          "
