name: debug
on: [push, workflow_dispatch]
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install --quiet pytest
      - name: doctor verbose
        working-directory: engine
        continue-on-error: true
        run: |
          python -m pco_engine.cli --backend windows doctor > ../doc.txt 2>&1
          echo "EXIT=$LASTEXITCODE" >> ../doc.txt
          exit 0
      - name: annotate
        run: |
          python -c "
          import pathlib
          lines = pathlib.Path('doc.txt').read_text(encoding='utf-8', errors='replace').splitlines()
          for ln in lines[:24]:
              print('::error::' + ln.replace('%','%%')[:800])
          "
