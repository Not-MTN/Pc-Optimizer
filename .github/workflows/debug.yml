name: debug
on: [push, workflow_dispatch]
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install --quiet pytest
      - name: which contract tests actually ran
        working-directory: engine
        env: { PCO_REAL_WINDOWS: "1" }
        run: |
          python -c "
          import subprocess,sys
          r=subprocess.run([sys.executable,'-m','pytest','tests/test_real_windows.py','-v','-rs'],capture_output=True,text=True,encoding='utf-8')
          for line in (r.stdout or '').splitlines():
              if 'PASSED' in line or 'SKIPPED' in line or 'passed' in line or 'skipped' in line:
                  print('::error::' + line.replace('%','%%')[:800])
          "
