name: tests

# The point of running on Windows is not "does Python work there". It is the one
# thing this repo genuinely cannot prove on Linux: that the real registry, sc.exe,
# schtasks.exe and powercfg.exe answer the way the mapping table assumes.
#
# The Linux job proves the *decisions*. The Windows job proves the *calls*.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: engine · Linux (3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: test
        working-directory: engine
        run: python -m pytest -q

  windows:
    name: engine · Windows 11 + real registry
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: unit tests (mapping logic, same as Linux)
        working-directory: engine
        run: python -m pytest -q
      - name: real-backend contract (the part Linux cannot run)
        working-directory: engine
        env:
          PCO_REAL_WINDOWS: "1"
        run: python -m pytest -q tests/test_real_windows.py -v
      - name: doctor (writes nothing; reports what this build can touch)
        working-directory: engine
        run: |
          # Reset the console encoding first: the default is cp1252, and this
          # output contains '·'. That is the bug this step originally caught.
          python -m pco_engine.cli --backend windows doctor
          # PowerShell's `>` writes UTF-16, so hand Python the redirect instead:
          python -c "import sys,json,subprocess;r=subprocess.run([sys.executable,'-m','pco_engine.cli','--backend','windows','doctor','--json'],capture_output=True,text=True,encoding='utf-8');d=json.loads(r.stdout);print(json.dumps(d['backend'],indent=1));print('catalog addresses:',d['catalog_addresses'],'readable now:',d['readable_now'])"
