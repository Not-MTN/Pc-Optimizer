name: tests

# The point of running on Windows is not "does Python work there". It is the one
# thing this repo genuinely cannot prove on Linux: that the real registry, sc.exe,
# schtasks.exe and powercfg.exe answer the way the mapping table assumes.
#
# The Linux job proves the *decisions*. The Windows job proves the *calls*.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: engine · Linux (3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: test
        working-directory: engine
        run: python -m pytest -q

  windows:
    name: engine · Windows 11 + real registry
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: unit tests (mapping logic, same as Linux)
        working-directory: engine
        run: python -m pytest -q
      - name: real-backend contract (this is the part Linux cannot run)
        working-directory: engine
        run: python -m pytest -q tests/test_real_windows.py -v
      - name: doctor (writes nothing; fails the build if a mapped address is unreachable)
        working-directory: engine
        run: |
          python -m pco_engine.cli --backend windows doctor
          python -m pco_engine.cli --backend windows doctor --json > doctor.json
          python -c "import json;d=json.load(open('doctor.json'));print(json.dumps(d['backend'],indent=1))"
