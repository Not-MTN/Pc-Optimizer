[pytest]
testpaths = tests
# Every test that needs a scratch directory gets one under /tmp and none of them
# are cleaned up by the suite itself. Three runs of a 550-test suite left 6.9 GB
# of `pytest-of-user` behind, which eventually fails the *unrelated* tests with
# "No space left on device" — a red suite with no bug in it.
#
# The conftest fixture below trims old run directories after every session.
addopts = -q
filterwarnings =
    error::DeprecationWarning:pco_engine.*
